---
openapi: 3.0.1
info:
  title: Loan ACL API definition
  description: Contains all API resources exposed by Loan ACL
  contact:
    name: Loans team
  version: 0.0.6
servers:
- url: http://localhost:50716
  description: Generated server url
paths:
  /table-fields:
    post:
      tags:
      - table-field-resource-controller
      summary: Retrieve a list of table field entries
      operationId: findAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableFieldReq'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableFieldRepr'
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
  /table-fields/find-one:
    post:
      tags:
      - table-field-resource-controller
      summary: Retrieve a single table field entry
      operationId: findOne
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableFieldDetailReq'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableFieldRepr'
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
  /parameters/find-one:
    post:
      tags:
      - parameter-resource-controller
      summary: Retrieve a single parameter entry
      operationId: findOne_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterReq'
        required: true
      responses:
        "500":
          description: InternalServerError
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterRepr'
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
  /loans/get-from-list:
    post:
      tags:
      - loan-resource-controller
      summary: GET with body payload - retrieve detailed LoanRepr for each loan in
        the input list
      operationId: retrieveLoansRepr
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanReq'
      responses:
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanRepr'
  /parties/{partyId}/loans:
    get:
      tags:
      - party-loan-resource-controller
      summary: Retrieve minimal loan list for a given party
      operationId: retrievePartyLoanMinimalReprList
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetLoanListReq'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalLoanRepr'
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
  /parties/{partyId}/loan-repayments:
    get:
      tags:
      - party-loan-resource-controller
      summary: Retrieve loan repayment list for all loans of a given party
      operationId: retrievePartyMinimalLoanRepaymentRepr
      parameters:
      - name: partyId
        in: path
        required: true
        schema:
          type: string
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetLoanListReq'
      responses:
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalLoanRepaymentRepr'
        "404":
          description: NotFoundError
  /loans:
    get:
      tags:
      - loan-resource-controller
      summary: Retrieve minimal loan list for the whole bank
      operationId: retrieveLoanMinimalReprList
      parameters:
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetLoanListReq'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalLoanRepr'
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
  /loans/{loanNumber}:
    get:
      tags:
      - loan-resource-controller
      summary: Retrieve detailed loan data given a loan number
      operationId: retrieveLoanRepr
      parameters:
      - name: loanNumber
        in: path
        required: true
        schema:
          type: string
      - name: referenceDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "500":
          description: InternalServerError
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanRepr'
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
  /loans/{loanNumber}/repayments:
    get:
      tags:
      - loan-resource-controller
      summary: Retrieve loan repayment list for a given loan number
      operationId: retrieveMinimalLoanRepaymentRepr
      parameters:
      - name: loanNumber
        in: path
        required: true
        schema:
          type: string
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetLoanRepaymentReq'
      responses:
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalLoanRepaymentRepr'
        "404":
          description: NotFoundError
  /loans/repayment-simulation:
    get:
      tags:
      - loan-resource-controller
      summary: Simulate loan repayment schedule (piano dimostrativo MG00ACL)
      operationId: simulateLoanRepaymentSchedule
      parameters:
      - name: simulateLoanRepaymentReq
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SimulateLoanRepaymentReq'
      responses:
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinimalLoanRepaymentRepr'
  /loans/products:
    get:
      tags:
      - loan-resource-controller
      summary: Retrieve loan product list (MG03ACL SETPRO/GETPRO)
      operationId: retrieveLoanProducts
      parameters:
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetLoanProductsReq'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanProductRepr'
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
  /loans/demonstrative-plan:
    get:
      tags:
      - loan-resource-controller
      summary: Get demonstrative plan with TAEG calculation (MG03ACL SETDIMO/GETRATA/GETSPESA)
      operationId: getDemonstrativePlan
      parameters:
      - name: req
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/GetDemonstrativePlanReq'
      responses:
        "500":
          description: InternalServerError
        "401":
          description: UnauthorizedError
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemonstrativePlanRepr'
        "400":
          description: BadRequestError
        "403":
          description: ForbiddenError
        "429":
          description: TooManyRequestsError
        "404":
          description: NotFoundError
components:
  schemas:
    TableFieldReq:
      required:
      - serviceCode
      - tableCode
      type: object
      properties:
        serviceCode:
          type: string
          description: Service Code
          example: string
        tableCode:
          type: string
          description: Table Code
          example: string
        elementCode:
          type: string
          description: Element Code
          example: string
        subElementCode:
          type: string
          description: Sub-element Code
          example: string
      description: Table field request
    TableFieldRepr:
      type: object
      properties:
        serviceCode:
          type: string
          description: Service Code
          example: string
        tableCode:
          type: string
          description: Table Code
          example: string
        elementCode:
          type: string
          description: Element Code
          example: string
        subElementCode:
          type: string
          description: Sub-element Code
          example: string
        elementStatus:
          type: string
          description: Element Status
          example: string
        description:
          type: string
          description: Description
          example: string
        shortDescription:
          type: string
          description: Short Description
          example: string
        validityStartDate:
          type: string
          description: Validity Start Date
          format: date
          example: 2023-05-27
        validityEndDate:
          type: string
          description: Validity End Date
          format: date
          example: 2023-05-27
      description: Table field response
    TableFieldDetailReq:
      required:
      - elementCode
      - serviceCode
      - tableCode
      type: object
      properties:
        serviceCode:
          type: string
          description: Service Code
          example: string
        tableCode:
          type: string
          description: Table Code
          example: string
        elementCode:
          type: string
          description: Element Code
          example: string
        subElementCode:
          type: string
          description: Sub-element Code
          example: string
      description: Table field detail request
    ParameterReq:
      required:
      - elementCode
      - serviceCode
      type: object
      properties:
        serviceCode:
          type: string
          description: Service Code
          example: string
        elementCode:
          type: string
          description: Element Code
          example: string
        subElementCode:
          type: string
          description: Sub-element Code
          example: string
      description: Parameter request
    ParameterRepr:
      type: object
      properties:
        stringValue:
          type: string
          description: String Value
          example: string
        numericValue:
          type: number
          description: Numeric Value
          example: 100.0
        dateValue:
          type: string
          description: Date Value
          format: date
          example: 2023-05-27
      description: Parameter response
    LoanDetailReq:
      required:
      - loanNumber
      type: object
      properties:
        loanNumber:
          type: string
          description: Loan Number
          example: 123456789
      description: Loan detail request
    LoanReq:
      required:
      - loanList
      - referenceDate
      type: object
      properties:
        referenceDate:
          type: string
          description: Reference Date
          format: date
          example: 2023-05-27
        loanList:
          type: array
          description: Loans list
          items:
            $ref: '#/components/schemas/LoanDetailReq'
      description: Loan request
    LoanProductType:
      type: string
      description: |-
        Loan Product type:
        CONSUMER: Consumer loan
        CORPORATE: Corporate loan
        LOAN: Loan
        MERCHANDISING: Merchandising loan
        MORTGAGE: Mortgage loan
        SYNDICATED: Syndicated loan
      example: string
      enum:
      - CONSUMER
      - CORPORATE
      - LOAN
      - MERCHANDISING
      - MORTGAGE
      - SYNDICATED
    LoanRepr:
      type: object
      properties:
        loanNumber:
          type: string
          description: Loan Number
          example: string
        partyDescriptionId:
          type: string
          description: Loan Description
          example: string
        partyId:
          type: string
          description: Party Id
          example: string
        loanStatus:
          type: string
          description: Loan Status
          example: string
        loanStatusDescription:
          type: string
          description: Loan Status Description
          example: string
        originationDate:
          type: string
          description: Origination Date
          format: date
          example: 2023-05-27
        risksAndCommitmentsDate:
          type: string
          description: Risks and Commitments Date
          format: date
          example: 2023-05-27
        firstDisbursementDate:
          type: string
          description: First Disbursement Date
          format: date
          example: 2023-05-27
        firstScheduledRepaymentDate:
          type: string
          description: First Scheduled Repayment Date
          format: date
          example: 2023-05-27
        firstRepaymentDate:
          type: string
          description: First Repayment Date
          format: date
          example: 2023-05-27
        maturityDate:
          type: string
          description: Maturity Date
          format: date
          example: 2023-05-27
        closingDate:
          type: string
          description: Closing Date
          format: date
          example: 2023-05-27
        interestRateType:
          type: string
          description: Interest Rate Type
          example: string
        interestRateTypeDescription:
          type: string
          description: Interest Rate Type Description
          example: string
        interestRate:
          type: number
          description: Interest Rate
          example: 3.5
        repaymentType:
          type: string
          description: Repayment Type
          example: string
        repaymentTypeDescription:
          type: string
          description: Repayment Type Description
          example: string
        interestPaymentType:
          type: integer
          description: Interest Payment Type
          format: int32
        interestPaymentTypeDescription:
          type: string
          description: Interest Payment Type Description
          example: string
        loanProductType:
          $ref: '#/components/schemas/LoanProductType'
        loanTypeCode:
          type: string
          description: Loan Type Code
          example: string
        loanType:
          type: string
          description: Loan Type
          example: string
        repaymentSchedulePeriodicity:
          type: integer
          description: Repayments Scheduled Per Year
          format: int32
          example: 4
        repaymentSchedulePeriodicityDescription:
          type: string
          description: Repayment Schedule Periodicity Description
          example: string
        prepaymentSchedulePeriodicity:
          type: integer
          description: Prepayments Scheduled Per Year
          format: int32
          example: 2
        prepaymentSchedulePeriodicityDescription:
          type: string
          description: Prepayment Schedule Periodicity Description
          example: string
        interestAccrualMethod:
          type: string
          description: Interest Accrual Method
          example: string
        interestAccrualMethodDescription:
          type: string
          description: Interest Accrual Method Description
          example: string
        prepaymentsInterestAccrualMethod:
          type: string
          description: Prepayments Interest Accrual Method
          example: string
        prepaymentsInterestAccrualMethodDescription:
          type: string
          description: Prepayments Interest Accrual Method Description
          example: string
        riskStatus:
