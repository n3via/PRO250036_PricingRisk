[pytest]
pythonpath = .
addopts = --clean-alluredir --alluredir=allure-results
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
norecursedirs = .git .venv .pytest_cache __pycache__

## Dice a pytest dove cercare i test
testpaths = PRO250036_PricingRisk/TestCases/Pricing

## I file test devono iniziare con test_
python_files = TC*.py
python_classes = Test*
python_functions = test_*